services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transformops
      POSTGRES_USER: transformops
      POSTGRES_PASSWORD: transformops
    ports:
      - "5432:5432"
    volumes:
      - transformops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transformops -d transformops"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  transformops-postgres:
