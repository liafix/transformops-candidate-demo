name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: transformops
          POSTGRES_USER: transformops
          POSTGRES_PASSWORD: transformops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transformops -d transformops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://transformops:transformops@localhost:5432/transformops?schema=public
      DIRECT_URL: postgresql://transformops:transformops@localhost:5432/transformops?schema=public
      DEMO_SEED_RESET_ALLOWED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Require committed lockfile
        run: test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed synthetic demo data
        run: npm run db:seed

      - name: Database smoke check
        run: npm run db:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
